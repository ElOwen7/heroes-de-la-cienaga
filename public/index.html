:root{--gold:#ffcf45;--ink:#080d2c;--purple:#a47aff;--cream:#fff9db}*{box-sizing:border-box}body{margin:0;background:#070d24;color:white;font-family:Nunito,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;background-image:radial-gradient(ellipse at 12% 13%,#26316d80,transparent 36%),radial-gradient(ellipse at 84% 83%,#3c225f80,transparent 45%)}button,input{font:inherit}.shell{width:min(1080px,100%)}.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;color:#b8bde0;font-size:12px;letter-spacing:1px;gap:12px}.top strong{color:var(--gold)}.tag{border:1px solid #545687;border-radius:30px;padding:6px 12px}.stage{position:relative;overflow:hidden;border:3px solid #5254a2;border-radius:16px;background:#0a1135;box-shadow:0 20px 65px #0009,0 0 0 5px #ffffff06;min-height:590px}.stage canvas{width:100%;height:auto;display:block;image-rendering:pixelated;aspect-ratio:16/9}.overlay{position:absolute;inset:0;background:linear-gradient(90deg,#0a0f31ed,#0a0f31cc 65%,#0a0f3170);display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto}.panel{width:min(780px,100%)}.eyebrow{font-family:'Press Start 2P',monospace;font-size:10px;color:#c9adff;line-height:1.8;letter-spacing:1px}.heading{font-family:'Press Start 2P',monospace;font-size:clamp(19px,3.5vw,35px);line-height:1.6;color:var(--gold);text-shadow:3px 4px #894a39;margin:14px 0}.lead{font-size:17px;line-height:1.55;color:#dce2fa;max-width:680px}.btn{background:var(--gold);border:0;border-bottom:5px solid #a96f24;border-radius:9px;padding:14px 19px;color:#24203b;font-weight:900;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:translateY(2px)}.btn.alt{background:#272c60;border:1px solid #666bb0;border-bottom:4px solid #151638;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.hero{cursor:pointer;border:2px solid #444979;border-radius:13px;background:#141c46da;padding:14px 7px 12px;text-align:center;transition:.2s}.hero:hover,.hero.active{border-color:var(--gold);background:#282b59;transform:translateY(-3px)}.avatar{height:78px;width:70px;margin:0 auto 7px;image-rendering:pixelated}.hero b{display:block;font-size:15px}.hero small{display:block;color:#bfc5e9;font-size:11px;line-height:1.4;margin-top:3px}.formrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.formrow label{display:grid;gap:6px;color:#dce1f6;font-weight:800;font-size:13px}.formrow input{background:#090f2d;color:white;border:1px solid #575d9b;padding:11px 13px;border-radius:8px;outline:none;width:min(310px,70vw)}.summary{border:1px solid #55568d;background:#0b1239ab;border-radius:10px;padding:13px 15px;color:#f3eac2;font-size:14px;line-height:1.5;margin-top:13px}.question{font-family:'Press Start 2P',monospace;font-size:clamp(13px,2vw,19px);line-height:1.65;color:var(--gold);margin:13px 0}.decision-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:24px}.decision{border:2px solid #7375a5;text-align:left;background:#1c2555;color:#e9ecff;border-radius:12px;padding:17px;cursor:pointer;min-height:112px;font-weight:800;line-height:1.45}.decision:hover{border-color:var(--gold);background:#343968}.decision b{color:var(--gold);display:block;margin-bottom:8px;font-family:'Press Start 2P';font-size:13px}.hud{position:absolute;top:15px;left:17px;right:17px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}.stat{background:#0a1037d9;border:1px solid #666aa5;border-radius:8px;padding:9px 12px;color:#fff6d5;font-size:12px;font-weight:900;box-shadow:0 3px #050a2a}.stat strong{color:var(--gold)}.controls{display:flex;align-items:center;gap:10px;margin-top:15px;flex-wrap:wrap;justify-content:space-between}.help{color:#b9bede;font-size:12px}.touch{display:flex;gap:8px}.touch button{background:#242c59;color:#fff;border:1px solid #6b75b1;border-radius:8px;padding:11px 15px;font-weight:900;cursor:pointer}.hidden{display:none!important}.foot{color:#9599bc;font-size:11px;margin-top:16px;text-align:center}.small-note{font-size:12px;color:#c6c9e2;line-height:1.55}.result{border-left:4px solid var(--gold);background:#1b2454;padding:14px;border-radius:0 8px 8px 0;margin-top:15px;line-height:1.6}.pill{display:inline-block;padding:5px 10px;background:#2d2b6b;color:#ffe08b;border-radius:20px;font-size:12px;font-weight:900}.progress{height:8px;width:min(300px,100%);background:#292c63;border-radius:30px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--gold);transition:width .3s}.kbd{background:#292d59;border:1px solid #696f9f;border-radius:5px;padding:2px 6px;color:#fff}@media(max-width:640px){body{padding:8px}.stage{min-height:620px}.stage canvas{height:620px;object-fit:cover}.overlay{padding:15px}.choices{grid-template-columns:repeat(2,1fr);gap:7px}.hero{padding:9px 5px}.avatar{height:52px;width:52px}.lead{font-size:14px}.decision-grid{grid-template-columns:1fr;gap:9px}.decision{min-height:0;padding:12px}.heading{font-size:17px}.hud{left:8px;right:8px;top:8px}.stat{font-size:10px;padding:6px}.controls{justify-content:center}.top{font-size:10px}.question{font-size:13px}}
</style></head>
<body><div class="shell"><div class="top"><span>✦ <strong>MARIPOSAS DORADAS</strong> · VIDEOJUEGO EDUCATIVO</span><span class="tag">DEMO JUGABLE · v0.1</span></div>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="Juego 2D en la Ciénaga de la Virgen"></canvas><div class="hud hidden" id="hud"><div class="stat">🦋 Doradas <strong id="coins">0</strong></div><div class="stat">🛡️ Protección <strong id="trust">0</strong></div><div class="stat">📖 Capítulo <strong id="level">1/3</strong></div><div class="stat">✨ <span id="skillname">Habilidad</span> <strong id="skillready">LISTA</strong></div></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div>
<div class="controls"><div class="help">Controles: <span class="kbd">ESPACIO</span> / <span class="kbd">↑</span> saltar · <span class="kbd">E</span> habilidad · <span class="kbd">P</span> pausar</div><div class="touch"><button id="jumpBtn">↑ SALTAR</button><button id="powerBtn">✨ PODER</button><button id="pauseBtn">Ⅱ PAUSA</button></div></div><p class="foot">Prototipo conceptual inspirado en el documento «Héroes de la Ciénaga de la Virgen» · No requiere instalación</p></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud');
const $=id=>document.getElementById(id);const W=960,H=540,G=438;
const heroes=[{name:'Amanda',skill:'Detener sombras',desc:'Imaginativa · congela las mariposas oscuras.',shirt:'#ef6b8b',skin:'#bd7555',hair:'#472231',pants:'#445d9e'},{name:'Miguel',skill:'Crear duplicado',desc:'Valiente · crea un doble que distrae.',shirt:'#dc8a42',skin:'#a66546',hair:'#231d29',pants:'#496f9e'},{name:'Ulises',skill:'Retroceder',desc:'Protector · cambia una decisión anterior.',shirt:'#52ac89',skin:'#ad6c4e',hair:'#272532',pants:'#926d43'},{name:'Gloria',skill:'Escudo de luz',desc:'Cuidadosa · activa un escudo protector.',shirt:'#e67c69',skin:'#ad674d',hair:'#603346',pants:'#5463a1'}];
const questions=[{title:'Una señal en el camino',scene:'Cerca del muelle, ves a una niña incómoda porque un desconocido insiste en llevarla a un lugar apartado.',a:'Buscar a una persona adulta de confianza y pedir ayuda.',b:'Ignorar la situación porque no te corresponde intervenir.',good:'A',goodText:'¡Bien! Pedir ayuda a una persona adulta de confianza puede proteger a alguien en riesgo.',badText:'Ignorar señales de alerta puede dejar a alguien sin ayuda. La protección es una responsabilidad compartida.'},{title:'Una oferta sospechosa',scene:'Una persona desconocida ofrece regalos a un niño si la acompaña sin avisarle a su familia.',a:'Decirle que acepte los regalos y guarde el secreto.',b:'Advertir que no se vaya y buscar a una persona adulta de confianza.',good:'B',goodText:'¡Correcto! Los regalos a cambio de secretos o aislamiento pueden ser señales de alerta.',badText:'Es importante desconfiar de ofertas que exigen secretos o alejan a niñas y niños de sus redes de apoyo.'},{title:'La decisión de los héroes',scene:'El guardián de la ciénaga te pide decidir qué hacer al conocer una posible situación de explotación infantil.',a:'Buscar apoyo y comunicar lo ocurrido por canales de protección.',b:'Publicar fotografías e información privada para que todos lo sepan.',good:'A',goodText:'¡Excelente! Buscar canales adecuados y proteger la privacidad es esencial.',badText:'Compartir datos o imágenes privadas puede causar más daño. Es preferible acudir a canales de protección.'}];
let hero=0,name='',mode='menu',score=0,trust=0,round=0,decisions=[],objects=[],t=0,spawn=0,dist=0,paused=false,powerUntil=0,coolUntil=0,last=0,invuln=0,player={x:175,y:G-60,vy:0,h:60};
function show(html){panel.innerHTML=html;overlay.classList.remove('hidden');hud.classList.add('hidden')}
function hide(){overlay.classList.add('hidden');hud.classList.remove('hidden')}
function home(){mode='menu';show(`<div class="eyebrow">✦ UNA AVENTURA NARRATIVA EN PIXEL ART ✦</div><h1 class="heading">HÉROES DE LA<br>CIÉNAGA DE LA VIRGEN</h1><p class="lead">Un mundo de mariposas doradas, sombras misteriosas y decisiones que importan. Corre, salta y protege la ciénaga a través de tres misiones interactivas.</p><div class="summary">🌟 <b>Tu historia, tus decisiones.</b> Elige entre cuatro héroes, personaliza tu nombre y descubre cuál de los dos finales te espera.</div><div class="cta"><button class="btn" id="start">▶ COMENZAR AVENTURA</button></div><p class="small-note">Inspirado en la propuesta educativa del proyecto. Las situaciones son ficticias y no contienen escenas explícitas.</p>`);$('start').onclick=choose}
function avatarSVG(h,scale=1){return `<svg class="avatar" viewBox="0 0 64 75" xmlns="http://www.w3.org/2000/svg" style="transform:scale(${scale})" shape-rendering="crispEdges"><path fill="${h.hair}" d="M18 11h30v6h6v20h-7v-7H17v7h-7V18h8z"/><path fill="${h.skin}" d="M18 20h29v24H18z"/><path fill="#1c192b" d="M23 31h5v5h-5zm15 0h5v5h-5z"/><path fill="${h.shirt}" d="M17 45h31v18H17z"/><path fill="${h.pants}" d="M20 61h10v12H20zm16 0h10v12H36z"/><path fill="${h.skin}" d="M11 47h7v13h-7zm37 0h7v13h-7z"/></svg>`}
function choose(){mode='choose';show(`<div class="eyebrow">PASO 01 / 02 · ESCOGE TU PROTAGONISTA</div><h2 class="heading">ELIGE A TU HÉROE</h2><p class="lead" style="font-size:14px">Cada personaje tiene una habilidad única. Puedes conservar su nombre o escribir uno propio.</p><div class="choices">${heroes.map((h,i)=>`<div class="hero ${i===hero?'active':''}" data-id="${i}">${avatarSVG(h)}<b>${h.name}</b><small>${h.skill}</small></div>`).join('')}</div><div class="formrow"><label>¿CÓMO SE LLAMARÁ TU HÉROE?<input id="nameInput" maxlength="18" placeholder="Escribe tu nombre (opcional)" value="${esc(name)}"></label></div><div class="summary" id="descHero">✨ <b>${heroes[hero].name}:</b> ${heroes[hero].desc}</div><div class="cta"><button class="btn" id="play">▶ INICIAR MISIÓN</button><button class="btn alt" id="back">← VOLVER</button></div>`);document.querySelectorAll('.hero').forEach(el=>el.onclick=()=>{hero=+el.dataset.id;document.querySelectorAll('.hero').forEach(x=>x.classList.toggle('active',x===el));$('descHero').innerHTML=`✨ <b>${heroes[hero].name}:</b> ${heroes[hero].desc}`});$('play').onclick=()=>{name=$('nameInput').value.trim()||heroes[hero].name;begin()};$('back').onclick=home}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function begin(){round=0;score=0;trust=0;decisions=[];phase()}
function phase(){mode='run';t=0;spawn=0;dist=0;objects=[];paused=false;player={x:175,y:G-60,vy:0,h:60};powerUntil=0;coolUntil=0;invuln=0;hide();updateHud()}
function updateHud(){$('coins').textContent=score;$('trust').textContent=trust;$('level').textContent=`${Math.min(round+1,3)}/3`;$('skillname').textContent=heroes[hero].skill;$('skillready').textContent=t>=coolUntil?'LISTA':Math.ceil((coolUntil-t)/60)+'s'}
function jump(){if(mode!=='run'||paused)return;if(player.y>=G-player.h-.1){player.vy=-14.2}}
function ability(){if(mode==='choice'&&hero===2&&decisions.length){rewind();return}if(mode!=='run'||paused||t<coolUntil)return;powerUntil=t+210;coolUntil=t+590;updateHud()}
function rewind(){if(hero!==2||!decisions.length)return;decisions.pop();trust=Math.max(0,trust-1);mode='choice';ask(true)}
function questionTime(){mode='choice';const q=questions[round];ask(false)}
function ask(revising){const q=questions[round];show(`<div class="eyebrow">CAPÍTULO ${round+1} / 3 · DECIDE TU CAMINO</div><span class="pill">🦋 ${score} mariposas · 🛡️ ${trust} puntos de protección</span><h2 class="question">${q.title}</h2><p class="lead">${q.scene}</p><p style="font-weight:900;color:#ddd8ff">¿QUÉ DECIDES HACER?</p><div class="decision-grid"><button class="decision" id="A"><b>OPCIÓN A</b>${q.a}</button><button class="decision" id="B"><b>OPCIÓN B</b>${q.b}</button></div><p class="small-note">Elige con el mouse o presiona <span class="kbd">A</span> / <span class="kbd">B</span>. Cada elección modifica tu historia.</p>${revising?'<p class="pill">↶ Ulises ha regresado para reconsiderar la decisión.</p>':''}`);$('A').onclick=()=>answer('A');$('B').onclick=()=>answer('B')}
function answer(choice){if(mode!=='choice')return;mode='feedback';const q=questions[round],good=choice===q.good;decisions.push({round,choice,good});if(good)trust++;show(`<div class="eyebrow">TU ELECCIÓN TIENE CONSECUENCIAS</div><h2 class="heading">${good?'✨ ¡BIEN HECHO!':'🌙 AÚN PUEDES APRENDER'}</h2><p class="lead">${good?q.goodText:q.badText}</p><div class="result"><b>Decidiste:</b> ${choice==='A'?q.a:q.b}<br><b>Impacto:</b> ${good?'+1 punto de protección':'Sin puntos de protección'}</div><div class="cta"><button class="btn" id="next">${round===2?'★ VER MI FINAL':'▶ CONTINUAR AVENTURA'}</button>${hero===2?'<button class="btn alt" id="redo">↶ RETROCEDER DECISIÓN</button>':''}</div>`);$('next').onclick=()=>{round++;if(round===3)finish();else phase()};if(hero===2)$('redo').onclick=()=>{decisions.pop();if(good)trust--;mode='choice';ask(true)}}
function finish(){mode='end';const happy=trust>=2;show(`<div class="eyebrow">✦ FIN DE LA AVENTURA · ${esc(name).toUpperCase()} ✦</div><h2 class="heading">${happy?'FINAL DORADO':'FINAL DE APRENDIZAJE'}</h2><p class="lead">${happy?'Las mariposas doradas iluminan la ciénaga. Tus decisiones ayudaron a reconocer riesgos y buscar apoyo seguro.':'Las sombras no desaparecieron por completo, pero ahora sabes que prestar atención, proteger la privacidad y pedir ayuda pueden marcar la diferencia.'}</p><div class="summary">🏆 <b>Protagonista:</b> ${esc(name)} (${heroes[hero].name})<br>🦋 <b>Mariposas:</b> ${score}<br>🛡️ <b>Decisiones protectoras:</b> ${trust} de 3</div><div class="progress"><div style="width:${trust/3*100}%"></div></div><p class="small-note">Fuera del juego: ante posibles situaciones de vulneración de derechos de niños, niñas y adolescentes, busca apoyo de una persona adulta de confianza y acude a canales de protección competentes. No difundas información privada.</p><div class="cta"><button class="btn" id="again">↻ JUGAR OTRA VEZ</button><button class="btn alt" id="switch">♟ CAMBIAR HÉROE</button></div>`);$('again').onclick=begin;$('switch').onclick=choose}
function pause(){if(mode!=='run')return;paused=!paused;if(paused){show(`<h2 class="heading">Ⅱ JUEGO EN PAUSA</h2><p class="lead">Tu aventura te espera.</p><div class="cta"><button class="btn" id="resume">▶ CONTINUAR</button><button class="btn alt" id="exit">⌂ MENÚ PRINCIPAL</button></div>`);$('resume').onclick=pause;$('exit').onclick=home}else hide()}
function rnd(n){let v=Math.sin(n*127.1+78.233)*43758.5453;return v-Math.floor(v)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function drawButterfly(x,y,c,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rect(-9,-6,8,8,c);rect(2,-6,8,8,c);rect(-8,3,7,6,c);rect(2,3,7,6,c);rect(-1,-7,3,17,'#4e3355');rect(-12,-2,4,4,'#fff1b0');rect(9,-2,4,4,'#fff1b0');ctx.restore()}
function drawHero(x,y,h,frame=0){const bob=Math.sin(frame*.27)*2;const b=y+bob;rect(x+9,b+3,33,11,h.hair);rect(x+5,b+13,43,21,h.hair);rect(x+13,b+15,26,22,h.skin);rect(x+17,b+26,5,5,'#25243b');rect(x+33,b+26,5,5,'#25243b');rect(x+12,b+39,29,17,h.shirt);rect(x+3,b+41,9,15,h.skin);rect(x+41,b+41,9,15,h.skin);let run=Math.sin(frame*.27)*7;rect(x+15+run,b+55,11,10,h.pants);rect(x+30-run,b+55,11,10,h.pants);rect(x+14+run,b+64,13,5,'#25283c');rect(x+29-run,b+64,13,5,'#25283c')}
function drawScene(){const k=mode==='run'&&!paused?dist:dist*.5;rect(0,0,W,H,'#0a1238');const grad=ctx.createLinearGradient(0,65,0,H);grad.addColorStop(0,'#0b1646');grad.addColorStop(.62,'#3b236e');grad.addColorStop(1,'#0b274d');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<95;i++){let x=rnd(i+11)*W,y=rnd(i+235)*270;rect(x,y,2+(i%7===0?2:0),2,i%5===0?'#d4d5ff':'#6f80bd')};ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.arc(770,110,48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9bd8e';ctx.beginPath();ctx.arc(752,99,13,0,Math.PI*2);ctx.arc(784,126,10,0,Math.PI*2);ctx.fill();for(let l=0;l<3;l++){let speed=[.07,.18,.32][l],base=[306,350,399][l],color=['#231c5e','#152453','#122647'][l];for(let i=-2;i<13;i++){let x=(i*120-k*speed%120);rect(x,base-30-rnd(i+50+l*23)*40,108,90,color);rect(x+16,base-63-rnd(i+50+l*23)*35,65,55,color)}}rect(0,379,W,90,'#0a3765');for(let i=0;i<33;i++){let x=i*40+(i%3)*6-(k*.28%40);rect(x,397+(i%4)*12,24,3,'#246ba0');rect(x+5,421+(i%5)*6,38,2,'#427cb6')}rect(0,436,W,104,'#173d38');rect(0,437,W,5,'#3a9475');for(let i=0;i<45;i++){let x=(i*34-k*.9%34),y=466+(i%4)*17;rect(x,y,16,5,'#285e46');rect(x+7,y-7,5,9,'#306e4b')}for(let i=0;i<14;i++){let x=(i*92+15-k*.43%105);rect(x,377,5,60,'#123c3a');rect(x-9,381,25,7,'#144d43');rect(x-17,387,16,5,'#144d43')}for(let i=0;i<8;i++){let x=(i*153+47-k*.15%156);drawButterfly(x,195+Math.sin(i*2+t*.023)*20,'#f7c344',.65)}
if(mode==='run'||mode==='choice'||mode==='feedback'||mode==='end'){for(let o of objects){let x=o.x,y=o.y;if(o.type==='coin')drawButterfly(x,y+Math.sin(t*.1+o.phase)*5,'#ffd44d',.9);else {drawButterfly(x,y,'#262337',1.3);rect(x-2,y+13,5,8,'#a67af2')}}if(hero===1&&t<powerUntil){ctx.globalAlpha=.4;drawHero(95,player.y,heroes[hero],t);ctx.globalAlpha=1}if(hero===3&&t<powerUntil){ctx.strokeStyle='#ffdf81';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x+26,player.y+35,52,0,7);ctx.stroke()}drawHero(player.x,player.y,heroes[hero],t);if(hero===0&&t<powerUntil){ctx.fillStyle='#c4a8ff';ctx.font='bold 15px monospace';ctx.fillText('❄ SOMBRAS DETENIDAS',325,95)}rect(0,532,W,8,'#081d2f')}else drawHero(205,G-60,heroes[hero],t)}
function tick(ts){let delta=Math.min(3,(ts-last)/16.667||1);last=ts;if(mode==='run'&&!paused){t+=delta;dist+=4.8*delta+round*.7;player.vy+=.7*delta;player.y+=player.vy*delta;if(player.y>=G-player.h){player.y=G-player.h;player.vy=0}spawn+=delta;if(spawn>38){spawn=0;objects.push({type:rnd(t)>.36?'coin':'shadow',x:995,y:rnd(t+99)>.52?G-39:G-95,phase:t})}for(const o of objects){o.x-=(5.8+round*.7)*delta*(hero===0&&t<powerUntil&&o.type==='shadow'?0:1);if(o.x<player.x+43&&o.x+14>player.x+6&&o.y+16>player.y+10&&o.y-14<player.y+player.h){if(o.type==='coin'){o.x=-100;score++}else if(t>invuln){o.x=-100;invuln=t+100;if(hero===3&&t<powerUntil)score+=1;else if(hero===1&&t<powerUntil)score+=1;else score=Math.max(0,score-2)}}}objects=objects.filter(o=>o.x>-30);if(t>650){questionTime()}updateHud()}else{t+=.15}drawScene();requestAnimationFrame(tick)}
$('jumpBtn').onclick=jump;$('powerBtn').onclick=ability;$('pauseBtn').onclick=pause;window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['Space','ArrowUp','KeyE','KeyP','KeyA','KeyB'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyE')ability();if(e.code==='KeyP')pause();if(mode==='choice'&&e.code==='KeyA')answer('A');if(mode==='choice'&&e.code==='KeyB')answer('B')});home();requestAnimationFrame(tick);
})();
